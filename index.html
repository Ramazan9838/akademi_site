<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<script>
  try { var t = localStorage.getItem('ak.tema'); if (t === 'acik' || t === 'koyu') document.documentElement.dataset.theme = t === 'koyu' ? 'dark' : 'light'; } catch (e) {}
</script>
<title>Giriş · TGM Öğrenci Takip Sistemi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='4' fill='%234F46E5'/></svg>">
<style>
  :root { --zemin: #f4f6fa; --kart: #ffffff; --yazi: #172038; --soluk: #606b80; --vurgu: #4f46e5; --vurgu2: #4338ca; --hata: #c82e4e; --cizgi: #e2e6ee; --golge: 0 24px 60px -24px rgba(30, 30, 80, .35); }
  /* Tema seçimi uygulamayla ortaktır (localStorage "ak.tema"; bkz. frontend/src/tema.ts) */
  :root[data-theme="dark"] { color-scheme: dark; --zemin: #0d1018; --kart: #161a26; --yazi: #e8ebf2; --soluk: #96a0b4; --vurgu: #8b84ff; --vurgu2: #7a72f5; --hata: #f06884; --cizgi: #293042; --golge: 0 24px 60px -24px rgba(0, 0, 0, .7); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --zemin: #0d1018; --kart: #161a26; --yazi: #e8ebf2; --soluk: #96a0b4; --vurgu: #8b84ff; --vurgu2: #7a72f5; --hata: #f06884; --cizgi: #293042; --golge: 0 24px 60px -24px rgba(0, 0, 0, .7); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--yazi);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
    background: radial-gradient(circle at 12% 8%, rgba(79, 70, 229, .16), transparent 45%), radial-gradient(circle at 92% 92%, rgba(200, 46, 78, .12), transparent 42%), var(--zemin); }
  form { width: 100%; max-width: 380px; background: var(--kart); border: 1px solid var(--cizgi); border-radius: 18px; padding: 28px 24px 22px; box-shadow: var(--golge); }
  .logo { display: block; width: 52px; height: 52px; margin: 0 auto 10px; }
  h1 { margin: 0; font-size: 1.45rem; font-weight: 700; text-align: center; }
  p { margin: 4px 0 18px; color: var(--soluk); font-size: .9rem; text-align: center; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=password] { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--cizgi); border-radius: 10px; background: transparent; color: var(--yazi); }
  input:focus { outline: none; border-color: var(--vurgu); box-shadow: 0 0 0 4px rgba(79, 70, 229, .18); }
  .hatirla { display: flex; gap: 8px; align-items: center; margin: 16px 0 18px; font-size: .88rem; font-weight: 400; color: var(--soluk); }
  button { width: 100%; padding: 12px; font: inherit; font-weight: 700; border: 0; border-radius: 10px; color: #fff; cursor: pointer; background: var(--vurgu); }
  button:hover { background: var(--vurgu2); }
  button:disabled { opacity: .6; cursor: progress; }
  #durum { min-height: 1.5em; margin: 14px 0 0; font-size: .9rem; text-align: center; }
  #durum.hata { color: var(--hata); }
  .tema { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 12px;
    background: var(--kart); color: var(--soluk); border: 1px solid var(--cizgi); box-shadow: 0 4px 14px rgba(0, 0, 0, .08); }
  .tema:hover { background: var(--kart); color: var(--yazi); }
  .tema svg { width: 18px; height: 18px; }
  .kilit { margin-top: 12px; font-size: .78rem; color: var(--soluk); text-align: center; }
</style>
</head>
<body>
<button type="button" class="tema" id="tema" aria-label="Temayı değiştir" title="Açık / koyu tema"></button>
<form id="giris" autocomplete="on">
  <svg class="logo" viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#c82e4e"/></linearGradient></defs><rect x="2" y="2" width="48" height="48" rx="14" fill="url(#lg)"/><path d="M12 22 26 15l14 7-14 7z" fill="#fff"/><path d="M18 26v7c0 2.5 3.6 4.5 8 4.5s8-2 8-4.5v-7l-8 4z" fill="#fff" opacity=".85"/><path d="M38 23v9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
  <h1>TGM Öğrenci Takip Sistemi</h1>
  <p>Bu site şifrelidir. İçerik yalnızca tarayıcınızda çözülür.</p>
  <label for="kullanici">Kullanıcı adı</label>
  <input id="kullanici" type="text" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="parola">Şifre</label>
  <input id="parola" type="password" autocomplete="current-password" required>
  <label class="hatirla"><input id="kalici" type="checkbox"> Bu cihazda 30 gün açık kalsın (aksi hâlde 12 saat)</label>
  <button id="dugme" type="submit">Giriş</button>
  <div id="durum" role="status"></div>
  <div class="kilit">🔒 AES-256 · kullanıcıya özel anahtar</div>
</form>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Açık / koyu tema düğmesi
  const GUNES = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  const AY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const koyuMu = () => document.documentElement.dataset.theme === 'dark'
    || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const temaCiz = () => { $('tema').innerHTML = koyuMu() ? GUNES : AY; };
  $('tema').addEventListener('click', () => {
    const t = koyuMu() ? 'acik' : 'koyu';
    document.documentElement.dataset.theme = t === 'koyu' ? 'dark' : 'light';
    try { localStorage.setItem('ak.tema', t); } catch (e) { /* gizli pencere */ }
    temaCiz();
  });
  temaCiz();
  const durum = (s, hata) => { $('durum').textContent = s; $('durum').className = hata ? 'hata' : ''; };
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const enc = new TextEncoder();
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle) {
    durum('Bu tarayıcı (veya gizli pencere) gerekli özellikleri desteklemiyor. Güncel Chrome, Edge, Safari ya da normal pencerede Firefox kullanın.', true);
    $('dugme').disabled = true;
    return;
  }
  function sinirli(islem, ms, mesaj) {
    let zamanlayici;
    const zamanAsimi = new Promise((_, red) => {
      zamanlayici = setTimeout(() => red(new Error(mesaj)), ms);
    });
    return Promise.race([islem, zamanAsimi]).finally(() => clearTimeout(zamanlayici));
  }
  async function jsonAl(adres, options = {}) {
    const iptal = new AbortController();
    const zamanlayici = setTimeout(() => iptal.abort(), 15000);
    try {
      const r = await fetch(adres, { ...options, signal: iptal.signal });
      if (!r.ok) throw new Error('Giriş dosyası alınamadı (HTTP ' + r.status + ').');
      return await r.json();
    } catch (h) {
      if (h.name === 'AbortError') throw new Error('Giriş dosyası indirilemedi. İnternet bağlantısını kontrol edip tekrar deneyin.');
      throw h;
    } finally { clearTimeout(zamanlayici); }
  }
  // Hata sayfa açılırken oluşsa bile yakalanır; girişte kullanıcıya bildirilir.
  const kayit = navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then((reg) => ({ reg }), (hata) => ({ hata }));
  // Yayın betiği doldurur: yeni eklenen kullanıcılar Pages güncellenene kadar (1-2 dk) GitHub'daki güncel kasadan da aranır.
  const DEPO = {"sahip":"Ramazan9838","depo":"akademi_site","dal":"claude/intelligent-galileo-04shjz"};
  async function guncelKasa() {
    if (!DEPO) return null;
    const yerel = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const adres = yerel ? `${location.origin}/raw/${DEPO.sahip}/${DEPO.depo}/${DEPO.dal}/kasa.json`
      : `https://api.github.com/repos/${DEPO.sahip}/${encodeURIComponent(DEPO.depo)}/contents/kasa.json?ref=${encodeURIComponent(DEPO.dal)}`;
    return jsonAl(adres, { cache: 'no-store', headers: yerel ? {} : { Accept: 'application/vnd.github.raw' } });
  }
  async function kasadaAra(kasa, kullanici, parola) {
    // WebKit'te ağır PBKDF2 işlemlerini sırayla çalıştır.
    const anahtarlar = kasa.anahtarlar || [];
    for (let i = 0; i < anahtarlar.length; i++) {
      durum('Kullanıcı doğrulanıyor… (' + (i + 1) + '/' + anahtarlar.length + ')');
      const bulunan = await sinirli(dene(anahtarlar[i], kullanici, parola, kasa.tekrar), 30000,
        'Şifre doğrulaması yanıt vermedi. Sayfayı yenileyip tekrar deneyin.');
      if (bulunan) return bulunan;
    }
    return null;
  }

  async function dene(giris, kullanici, parola, tekrar) {
    const temel = await crypto.subtle.importKey('raw', enc.encode(`${kullanici}\u0000${parola}`), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(giris.tuz), iterations: tekrar }, temel, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const b = b64(giris.sarili);
    try {
      const duz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12), additionalData: enc.encode('anahtar') }, k, b.subarray(12));
      return { ...JSON.parse(new TextDecoder().decode(duz)), id: giris.id };
    } catch { return null; }
  }

  $('giris').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('dugme').disabled = true;
    durum('Doğrulanıyor… (birkaç saniye sürebilir)');
    try {
      const kasa = await jsonAl('kasa.json', { cache: 'no-store' });
      const kullanici = $('kullanici').value.trim().toLocaleLowerCase('tr-TR');
      let bulunan = await kasadaAra(kasa, kullanici, $('parola').value);
      if (!bulunan) {
        const guncel = await guncelKasa().catch(() => null);
        const bilinen = new Set((kasa.anahtarlar || []).map((g) => g.sarili));
        if (guncel) bulunan = await kasadaAra({ ...guncel, anahtarlar: (guncel.anahtarlar || []).filter((g) => !bilinen.has(g.sarili)) }, kullanici, $('parola').value);
      }
      if (!bulunan) {
        durum('Kullanıcı adı veya şifre hatalı.', true);
        $('dugme').disabled = false;
        $('parola').select();
        return;
      }
      durum('Anahtar hazırlanıyor…');
      const sonuc = await sinirli(kayit, 15000, 'Güvenlik bileşeni yüklenemedi. Sayfayı yenileyip tekrar deneyin.');
      if (sonuc.hata) throw sonuc.hata;
      const reg = await sinirli(navigator.serviceWorker.ready, 15000, 'Güvenlik bileşeni etkinleşmedi. Sayfayı yenileyip tekrar deneyin.');
      const kanal = new MessageChannel();
      const yanit = new Promise((ok) => { kanal.port1.onmessage = (m) => ok(m.data); });
      const ham = b64(bulunan.ham);
      reg.active.postMessage({ tur: 'giris', ham: ham.buffer, uid: bulunan.u, entryId: bulunan.id, username: bulunan.n, kalici: $('kalici').checked }, [kanal.port2]);
      let y;
      try {
        y = await sinirli(yanit, 15000, 'Oturum anahtarı kaydedilemedi. Normal Safari sekmesinden tekrar deneyin.');
      } finally { kanal.port1.close(); }
      if (!y || !y.ok) throw new Error((y && y.hata) || 'anahtar kaydedilemedi');
      durum('Açılıyor…');
      // Oturum kaydı transaction tamamlanınca onaylanır. İlk iOS sayfası
      // clients.claim() ile kontrol edilmemiş olsa da yeni gezinme kapsamla
      // eşleşen aktif işçiye gider. Eski belgenin controller'ını beklemek,
      // başarılı oturumu gereksiz yere engeller; anahtar/parola URL'ye yazılmaz.
      // Aynı adrese yönlendirme Safari'de mevcut giriş belgesinde kalmasın.
      const hedef = new URL(location.pathname.replace(/index\.html$/, ''), location.origin);
      hedef.searchParams.set('giris', Date.now().toString(36));
      location.replace(hedef.href);
    } catch (h) {
      durum(`Giriş tamamlanamadı: ${h.message || h}`, true);
      $('dugme').disabled = false;
    }
  });
})();
</script>
</body>
</html>
